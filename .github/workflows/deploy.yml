name: Deploy TubeGrowth

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy site
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment script
        shell: pwsh
        run: |
          if (-not $env:DEPLOY_USER -or -not $env:DEPLOY_HOST -or -not $env:DEPLOY_PATH) {
            throw 'Missing required deployment environment variables: DEPLOY_USER, DEPLOY_HOST, DEPLOY_PATH.'
          }
          ./deploy/deploy_and_cleanup.ps1 -CleanupAction DryRun

<!DOCTYPE html>
<html>
<head>
  <title>Tube Growth Redirect</title>
  <meta name="application-name" content="Tube Growth">
  <meta name="apple-mobile-web-app-title" content="Tube Growth">
  <!-- Google AdSense site ownership (verification) -->
  <meta name="google-adsense-account" content="ca-pub-8786593139834578">
  <script>
    // Force redirect to custom domain and preserve path
    var canonicalHost = 'tubegrowth.me';
    var currentHost = window.location.hostname || '';
    var isGithubPages = /github\.io$/i.test(currentHost);
    var path = window.location.pathname + (window.location.search || '') + (window.location.hash || '');
    
    // Always redirect if on github.io or any other non-canonical domain
    if (isGithubPages || (currentHost !== canonicalHost && currentHost !== 'localhost' && currentHost !== '127.0.0.1')) {
      window.location.href = 'https://' + canonicalHost + path;
    } else if (path && path !== '/') {
      // If on canonical domain but path exists, redirect to index with path in sessionStorage
      sessionStorage.redirect = path;
      window.location.href = '/';
    }
  </script>
</head> 
<body></body>
</html>

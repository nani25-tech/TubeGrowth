<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeGrowth Admin</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TubeGrowth Admin</p>
        <h1>Users</h1>
        <p class="subhead">All users for tubegrowth.zone.id in one list.</p>
      </div>
      <div class="auth-box">
        <span id="authStatus">Not signed in</span>
        <button id="logoutBtn" type="button" class="ghost">Logout</button>
      </div>
    </header>

    <section class="panel auth-panel">
      <form id="loginForm" class="login-form">
        <label>
          Email
          <input id="email" type="email" value="admin@tubegrowth.tg" required>
        </label>
        <label>
          Password
          <input id="password" type="password" value="Admin@25" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>

    <section class="panel users-panel">
      <div class="panel-head">
        <h2>All Users</h2>
        <button class="ghost" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Channel Name</th>
              <th>Channel ID</th>
              <th>Credits</th>
              <th>Email</th>
              <th>Admin</th>
              <th>Banned</th>
            </tr>
          </thead>
          <tbody id="usersTable">
            <tr><td colspan="7">Sign in to load users.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>

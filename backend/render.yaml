services:
  - type: web
    name: tubegrowth-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://tubegrowth.zone.id,https://www.tubegrowth.zone.id,https://nani25-tech.github.io,https://nani25-tech.github.io/TubeGrowth,http://localhost:3000,http://localhost:5173
